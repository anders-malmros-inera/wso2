services:
  apim:
    image: wso2/wso2am:${APIM_VERSION}
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - JAVA_OPTS=-Duser.timezone=${TIMEZONE}
      - WSO2_SERVER_HOST=apim
    volumes:
      - apim_repository:/home/wso2carbon/wso2am/repository
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:9443/services/Version"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - mgmt_net

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    restart: unless-stopped
    command: start-dev --http-port=8082 --import-realm
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      mgmt_net:
        aliases:
          - keycloak

  dmz-gateway-adapter:
    image: wso2/choreo-connect-adapter:${CC_VERSION}
    restart: unless-stopped
    depends_on:
      - apim
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ./config/choreo-connect/config.toml:/home/wso2/config.toml:ro
      - ./config/choreo-connect/security/keystore:/home/wso2/security/keystore:ro
      - ./config/choreo-connect/security/truststore:/home/wso2/security/truststore:ro
    networks:
      mgmt_net:
        aliases:
          - adapter
      dmz_net:
        aliases:
          - adapter

  dmz-gateway-enforcer:
    image: wso2/choreo-connect-enforcer:${CC_VERSION}
    restart: unless-stopped
    depends_on:
      - dmz-gateway-adapter
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ./config/choreo-connect/security/keystore:/home/wso2/security/keystore:ro
      - ./config/choreo-connect/security/truststore:/home/wso2/security/truststore:ro
    networks:
      - mgmt_net
      - dmz_net

  dmz-gateway-router:
    image: wso2/choreo-connect-router:${CC_VERSION}
    restart: unless-stopped
    depends_on:
      - dmz-gateway-adapter
      - dmz-gateway-enforcer
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ./config/choreo-connect/security/keystore:/home/wso2/security/keystore:ro
      - ./config/choreo-connect/security/truststore:/home/wso2/security/truststore:ro
    networks:
      - dmz_net
      - internal_net

  backend:
    image: mccutchen/go-httpbin
    restart: unless-stopped
    environment:
      - PORT=8080
    expose:
      - "8080"
    networks:
      - internal_net

volumes:
  apim_repository:

networks:
  mgmt_net:
  dmz_net:
  internal_net:

