name: wso2-test

services:
  apim:
    ports:
      - "9443:9443"   # Admin/Publisher/Dev portal (HTTPS)
      - "9763:9763"   # Admin/Publisher/Dev portal (HTTP, test only)
  keycloak:
    ports:
      - "8082:8082"   # Keycloak HTTP (test only)
  dmz-gateway-router:
    ports:
      - "9090:9090"   # Gateway listener for external traffic
      - "9095:9095"   # Admin/metrics for the gateway
  backend:
    ports:
      - "8081:8080"   # Direct backend access for debugging
